name: Build node
description: Builds node production bundle via pnpm

inputs:
  working-directory:
    description: "Directory to run the action in"
    default: "."
  script:
    description: "Build script name defined in package.json"
    default: "build"
  filter:
    description: "pnpm --filter selector for workspace packages (e.g. web)"
    default: ""
  args:
    description: "Additional arguments passed to the script, split on whitespace"
    default: ""

runs:
  using: composite
  steps:
    - name: Build node
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        SCRIPT: ${{ inputs.script }}
        FILTER: ${{ inputs.filter }}
        ARGS: ${{ inputs.args }}
      run: |
        set -f
        pnpm ${FILTER:+--filter "$FILTER"} run "$SCRIPT" $ARGS
