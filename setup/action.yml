name: Setup Node & pnpm deps
description: Sets up pnpm, Node.js, and installs dependencies

inputs:
  node-version:
    description: "Node.js version (takes precedence over node-version-file)"
    default: ""
  node-version-file:
    description: "Node.js version file relative to working-directory (e.g. .nvmrc, package.json)"
    default: ""
  pnpm-version:
    description: "pnpm version"
    default: ""
  working-directory:
    description: "Directory to run the action in"
    default: "."
  cache-dependency-path:
    description: "Explicit path to lockfile for cache hashing"
    default: ""

runs:
  using: composite
  steps:
    - name: Validate inputs
      shell: bash
      env:
        NODE_VERSION: ${{ inputs.node-version }}
        NODE_VERSION_FILE: ${{ inputs.node-version-file }}
      run: |
        if [ -z "$NODE_VERSION" ] && [ -z "$NODE_VERSION_FILE" ]; then
          echo "::error::Set node-version (e.g. \"24\") or node-version-file (e.g. \".nvmrc\")."
          exit 1
        fi

    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      with:
        version: ${{ inputs.pnpm-version }}
        package_json_file: ${{ inputs.working-directory }}/package.json

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}
        node-version-file: ${{ inputs.node-version-file != '' && format('{0}/{1}', inputs.working-directory, inputs.node-version-file) || '' }}
        cache: pnpm
        cache-dependency-path: ${{ inputs.cache-dependency-path != '' && inputs.cache-dependency-path || format('{0}/pnpm-lock.yaml', inputs.working-directory) }}

    - name: Install deps
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: pnpm install --frozen-lockfile
