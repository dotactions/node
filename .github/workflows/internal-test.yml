name: Test Node Actions

on:
  pull_request:
    paths:
      - "build/**"
      - "setup/**"
      - ".github/workflows/internal-test.yml"
      - "tests/fixtures/**"
  push:
    branches: [main]
    paths:
      - "build/**"
      - "setup/**"
      - ".github/workflows/internal-test.yml"
      - "tests/fixtures/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-node-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test-node-actions:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test setup without a Node version
        id: setup-invalid
        continue-on-error: true
        uses: ./setup
        with:
          working-directory: tests/fixtures

      - name: Assert missing Node version is rejected
        env:
          OUTCOME: ${{ steps.setup-invalid.outcome }}
        run: '[ "$OUTCOME" = failure ] || { echo "Expected failure, got $OUTCOME"; exit 1; }'

      - name: Test setup with node-version-file
        uses: ./setup
        with:
          working-directory: tests/fixtures
          node-version-file: .nvmrc

      - name: Assert toolchain versions
        run: |
          # Node: fixture's .nvmrc; pnpm: fixture's packageManager field
          [[ "$(node -v)" == v22.* ]] || { echo "Expected Node 22, got $(node -v)"; exit 1; }
          EXPECTED_PNPM=$(jq -r '.packageManager | sub("^pnpm@"; "") | sub("\\+.*$"; "")' tests/fixtures/package.json)
          [ "$(pnpm -v)" = "$EXPECTED_PNPM" ] || { echo "Expected pnpm $EXPECTED_PNPM (from packageManager), got $(pnpm -v)"; exit 1; }

      - name: Test setup with node-version over node-version-file
        uses: ./setup
        with:
          working-directory: tests/fixtures
          node-version: "24"
          node-version-file: .nvmrc
          cache-dependency-path: tests/fixtures/pnpm-lock.yaml

      - name: Assert node-version takes precedence
        run: '[[ "$(node -v)" == v24.* ]] || { echo "Expected Node 24, got $(node -v)"; exit 1; }'

      - name: Test build
        uses: ./build
        with:
          working-directory: tests/fixtures

      - name: Assert no args by default
        run: |
          ACTUAL=$(cat tests/fixtures/build-args.json)
          [ "$ACTUAL" = '[]' ] || { echo "Expected [], got $ACTUAL"; exit 1; }

      - name: Test build with args
        uses: ./build
        with:
          working-directory: tests/fixtures
          args: "--foo --bar=baz *.js"

      - name: Assert args were split but not glob-expanded
        run: |
          ACTUAL=$(cat tests/fixtures/build-args.json)
          [ "$ACTUAL" = '["--foo","--bar=baz","*.js"]' ] || { echo "Expected [\"--foo\",\"--bar=baz\",\"*.js\"], got $ACTUAL"; exit 1; }

      - name: Test build with filter
        uses: ./build
        with:
          working-directory: tests/fixtures
          filter: web

      - name: Assert the filtered package was built
        run: test -f tests/fixtures/packages/web/filtered.txt
